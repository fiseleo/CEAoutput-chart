<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEA Output Chart Viewer</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="ceaparse.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#293548; --text:#e2e8f0;
    --muted:#94a3b8; --accent:#38bdf8; --border:#334155;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;background:var(--bg);z-index:10}
  header h1{font-size:16px;margin:0;font-weight:600}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:auto}
  label{font-size:12px;color:var(--muted);display:inline-flex;flex-direction:column;gap:3px}
  select,button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px}
  select:hover,button:hover{background:var(--panel2);cursor:pointer}
  button.primary{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600}
  #fileInput{font-size:12px;color:var(--muted);max-width:220px}
  #dropzone{border:2px dashed var(--border);border-radius:12px;padding:36px;text-align:center;color:var(--muted);margin:20px;display:block}
  #dropzone.drag{background:var(--panel);border-color:var(--accent)}
  .meta{color:var(--muted);font-size:13px;padding:12px 20px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:16px;padding:16px 20px 40px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
  .card.full{grid-column:1/-1}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px}
  .card h2{font-size:14px;margin:0;font-weight:600;color:var(--muted)}
  .card .chart{width:100%;height:420px}
  .saveBtn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px}
  .saveBtn:hover{cursor:pointer;background:#384763}
  #summaryTable{overflow-x:auto}
  table.summary{width:100%;border-collapse:collapse;font-size:13px}
  table.summary th,table.summary td{border:1px solid var(--border);padding:6px 10px;text-align:right}
  table.summary th{background:var(--panel2);color:var(--text);font-weight:600}
  table.summary td:first-child,table.summary th:first-child{text-align:left}
  #status{color:var(--muted);font-size:13px}
  #status.error{color:#f87171}
</style>
</head>
<body>
<header>
  <h1>CEA Rocket Performance Charts</h1>
  <div class="controls">
    <label>Station
      <select id="station">
        <option value="chamber" selected>Chamber</option>
        <option value="throat">Throat</option>
      </select>
    </label>
    <label>Font size
      <select id="fontSize">
        <option value="12">Small</option>
        <option value="14" selected>Medium</option>
        <option value="16">Large</option>
        <option value="18">X-Large</option>
        <option value="20">XX-Large</option>
      </select>
    </label>
    <label>Units
      <select id="unitSystem">
        <option value="si" selected>SI</option>
        <option value="imperial">Imperial</option>
      </select>
    </label>
    <button id="exportBtn">Export CSV</button>
    <label>Mass fraction pressure
      <select id="mfPressure"></select>
    </label>
    <label>Heatmap metric
      <select id="heatMetric">
        <option value="Isp">Specific Impulse</option>
        <option value="T" selected>Temperature</option>
        <option value="CSTAR">C*</option>
        <option value="MW">Molecular Weight</option>
        <option value="GAMMA">Gamma</option>
      </select>
    </label>
    <label>Image format
      <select id="saveFormat">
        <option value="png" selected>PNG</option>
        <option value="svg">SVG</option>
        <option value="jpeg">JPEG</option>
        <option value="webp">WebP</option>
      </select>
    </label>
    <button id="saveAllBtn">Save all charts</button>
    <input type="file" id="fileInput" accept=".txt,text/plain">
    <button id="reloadBtn" class="primary">Reload output.txt</button>
    <span id="status"></span>
  </div>
</header>
<div id="dropzone">Drop a CEA output .txt file here</div>
<div class="meta" id="meta"></div>
<div class="grid" id="charts">
  <div class="card full"><div class="card-head"><h2>Summary — best O/F (max Isp)</h2></div><div id="summaryTable"></div></div>
  <div class="card"><div class="card-head"><h2>Specific Impulse vs O/F</h2><button class="saveBtn" data-chart="chIsp" title="Save as image">Save</button></div><div class="chart" id="chIsp"></div></div>
  <div class="card"><div class="card-head"><h2>Temperature vs O/F</h2><button class="saveBtn" data-chart="chT" title="Save as image">Save</button></div><div class="chart" id="chT"></div></div>
  <div class="card"><div class="card-head"><h2>Characteristic Velocity C* vs O/F</h2><button class="saveBtn" data-chart="chCstar" title="Save as image">Save</button></div><div class="chart" id="chCstar"></div></div>
  <div class="card"><div class="card-head"><h2>Molecular Weight vs O/F</h2><button class="saveBtn" data-chart="chMW" title="Save as image">Save</button></div><div class="chart" id="chMW"></div></div>
  <div class="card"><div class="card-head"><h2>Mass Fractions vs O/F</h2><button class="saveBtn" data-chart="chMF" title="Save as image">Save</button></div><div class="chart" id="chMF"></div></div>
  <div class="card full"><div class="card-head"><h2>Performance Map</h2><button class="saveBtn" data-chart="chHeat" title="Save as image">Save</button></div><div class="chart" id="chHeat"></div></div>
</div>

<script>
"use strict";

/* ---------------- helpers ---------------- */
function getSorted(data){
  const pins = [...new Set(data.cases.map(c => c.pin))].sort((a,b) => a-b);
  const ofs = [...new Set(data.cases.map(c => c.of))].sort((a,b) => a-b);
  return { pins, ofs };
}

function getVal(c, station, field){
  if(field in c.perf) return c.perf[field];
  return station === "chamber" ? c.chamber[field] : c.throat[field];
}

function seriesFor(data, pin, station, field){
  const ofs = [...new Set(data.cases.filter(c => c.pin === pin).map(c => c.of))].sort((a,b) => a-b);
  const x = [], y = [];
  for(const of of ofs){
    const c = data.cases.find(c => c.pin === pin && c.of === of);
    const v = c ? getVal(c, station, field) : undefined;
    if(v !== undefined && v !== null && !isNaN(v)){ x.push(of); y.push(v); }
  }
  return { x, y };
}

function speciesForPin(data, pin, station){
  const idx = station === "chamber" ? 0 : 1;
  const map = new Map();
  for(const c of data.cases){
    if(c.pin !== pin) continue;
    for(const sp in c.massfrac){
      const v = c.massfrac[sp][idx];
      if(v !== undefined && !isNaN(v)){
        map.set(sp, Math.max(map.get(sp) || 0, v));
      }
    }
  }
  return [...map.entries()]
    .sort((a,b) => b[1] - a[1])
    .filter(([,v]) => v >= 1e-4)
    .map(([sp]) => sp)
    .slice(0, 14);
}

/* ---------------- units ---------------- */
function convValue(field, v){
  if(unitSystem !== "imperial") return v;
  if(v === null || v === undefined || isNaN(v)) return v;
  switch(field){
    case "T": return v * 9/5 - 459.67;                 // K -> deg F
    case "P": return v * 14.5038;                       // bar -> psi
    case "Isp": case "Ivac": case "CSTAR": case "SONVEL":
      return v * 3.28084;                               // m/s -> ft/s
    default: return v;
  }
}

function unitLabel(field){
  const imp = unitSystem === "imperial";
  if(field === "T") return imp ? "\u00b0F" : "K";
  if(field === "P") return imp ? "psi" : "bar";
  if(field === "Isp" || field === "Ivac" || field === "CSTAR" || field === "SONVEL")
    return imp ? "ft/s" : "m/s";
  if(field === "MW") return "g/mol";
  if(field === "GAMMA") return "";
  return "";
}

const FIELD_NAMES = {
  Isp: "Isp", Ivac: "Ivac", T: "Temperature", P: "Pressure",
  CSTAR: "C*", MW: "Molecular weight", GAMMA: "Specific heat ratio", SONVEL: "Sound velocity"
};

function yTitleFor(field){
  const u = unitLabel(field);
  return (FIELD_NAMES[field] || field) + (u ? " (" + u + ")" : "");
}

/* ---------------- layout & plot ---------------- */
function baseLayout(title, xtitle, ytitle){
  const fs = fontBase;
  return {
    title: { text: title, font: { size: fs + 1 } },
    xaxis: { title: xtitle, gridcolor: "#475569", titlefont: { size: fs }, tickfont: { size: fs - 2 } },
    yaxis: { title: ytitle, gridcolor: "#475569", titlefont: { size: fs }, tickfont: { size: fs - 2 } },
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(0,0,0,0)",
    font: { color: "#e2e8f0" },
    margin: { l: 62, r: 20, t: 32, b: 52 },
    legend: { font: { size: fs - 2 } },
    hovermode: "closest",
    hoverlabel: { font: { size: fs - 2 } }
  };
}

function bestPoint(data, pin, station, field){
  const s = seriesFor(data, pin, station, field);
  if(!s.x.length) return null;
  let bi = 0;
  for(let i = 1; i < s.y.length; i++) if(s.y[i] > s.y[bi]) bi = i;
  return { x: s.x[bi], y: s.y[bi] };
}

function plotLines(div, data, field, station, title, markBest){
  const { pins } = getSorted(data);
  const yTitle = yTitleFor(field);
  const traces = pins.map(pin => {
    const s = seriesFor(data, pin, station, field);
    const y = s.y.map(v => convValue(field, v));
    return { x: s.x, y, mode: "lines+markers", name: pin + " psia", type: "scatter",
             line: { width: 3 }, marker: { size: 5 } };
  });
  if(markBest){
    const bx = [], by = [];
    pins.forEach(pin => {
      const p = bestPoint(data, pin, station, field);
      if(p){ bx.push(p.x); by.push(convValue(field, p.y)); }
    });
    traces.push({
      x: bx, y: by, mode: "markers", type: "scatter", name: "Best O/F",
      marker: { size: 13, symbol: "star", color: "#fbbf24", line: { width: 1, color: "#000000" } },
      hovertemplate: "O/F %{x:.3f}<br>" + yTitle + " %{y:.2f}<extra>Best O/F</extra>"
    });
  }
  Plotly.newPlot(div, traces, baseLayout(title, "O/F ratio", yTitle), { responsive: true, displayModeBar: false });
}

function plotMassFractions(div, data, pin, station){
  const idx = station === "chamber" ? 0 : 1;
  const comp = data.meta.compType === "mole" ? "mole" : "mass";
  const ofs = [...new Set(data.cases.filter(c => c.pin === pin).map(c => c.of))].sort((a,b) => a-b);
  const species = speciesForPin(data, pin, station);
  const traces = species.map(sp => {
    const y = ofs.map(of => {
      const c = data.cases.find(c => c.pin === pin && c.of === of);
      const v = c && c.massfrac[sp] ? c.massfrac[sp][idx] : 0;
      return v * 100;
    });
    return { x: ofs, y, mode: "lines", name: sp, type: "scatter",
             stackgroup: "one", line: { width: 0.5 },
             hovertemplate: sp + ": %{y:.2f}%" };
  });
  const layout = baseLayout(
    (station === "chamber" ? "Chamber " : "Throat ") + comp + " fractions",
    "O/F ratio", (comp === "mole" ? "Mole fraction (%)" : "Mass fraction (%)"));
  layout.yaxis.range = [0, 100];
  Plotly.newPlot(div, traces, layout, { responsive: true, displayModeBar: false });
}

function plotHeatmap(div, data, field, station, title){
  const { pins, ofs } = getSorted(data);
  const z = pins.map(pin => ofs.map(of => {
    const c = data.cases.find(c => c.pin === pin && c.of === of);
    const v = c ? getVal(c, station, field) : null;
    return v == null ? null : convValue(field, v);
  }));
  const heat = { z, x: ofs, y: pins, type: "heatmap", colorscale: "Viridis", hoverongaps: false,
    colorbar: { title: { text: unitLabel(field) || field, side: "right" } } };
  const cont = { z, x: ofs, y: pins, type: "contour", showscale: false, hoverinfo: "skip",
    contours: { coloring: "lines", showlabels: true, labelfont: { size: Math.max(8, fontBase - 4), color: "#000000" } },
    line: { color: "#000000", width: 1.2 } };
  Plotly.newPlot(div, [heat, cont], baseLayout(title, "O/F ratio", "Pressure (psia)"),
    { responsive: true, displayModeBar: false });
}

/* ---------------- save / export ---------------- */
const CHART_DEFS = [
  { id: "chIsp",   file: "Isp_vs_OF" },
  { id: "chT",     file: "Temperature_vs_OF" },
  { id: "chCstar", file: "Cstar_vs_OF" },
  { id: "chMW",    file: "MW_vs_OF" },
  { id: "chMF",    file: "MassFractions_vs_OF" },
  { id: "chHeat",  file: "Performance_Map" }
];

const DARK_THEME = {
  paper_bgcolor: "rgba(0,0,0,0)",
  plot_bgcolor: "rgba(0,0,0,0)",
  font: { color: "#e2e8f0" },
  "xaxis.gridcolor": "#475569",
  "yaxis.gridcolor": "#475569"
};

const LIGHT_THEME = {
  paper_bgcolor: "#ffffff",
  plot_bgcolor: "#ffffff",
  font: { color: "#000000" },
  "xaxis.gridcolor": "#cccccc",
  "yaxis.gridcolor": "#cccccc"
};

async function saveChart(id){
  const gd = document.getElementById(id);
  if(!gd || !gd.data) return;
  const fmt = document.getElementById("saveFormat").value;
  const def = CHART_DEFS.find(d => d.id === id);
  try{
    await Plotly.relayout(gd, LIGHT_THEME);
    await Plotly.downloadImage(gd, {
      format: fmt,
      filename: "CEA_" + (def ? def.file : id),
      width: 1200,
      height: 700,
      scale: 2
    });
  }catch(err){
    console.error("Save failed:", err);
  }finally{
    await Plotly.relayout(gd, DARK_THEME);
  }
}

function saveAll(){
  if(!currentData) return;
  const status = document.getElementById("status");
  const total = CHART_DEFS.length;
  CHART_DEFS.forEach((d, i) => {
    setTimeout(() => {
      saveChart(d.id);
      status.textContent = "Saving charts... " + (i + 1) + "/" + total;
      if(i === total - 1){
        setTimeout(() => { status.textContent = "Saved " + total + " charts."; }, 1500);
      }
    }, i * 600);
  });
}

/* ---------------- data export ---------------- */
function csvCell(v){
  if(v === null || v === undefined) return "";
  let s;
  if(typeof v === "number"){
    if(!isFinite(v)) return "";
    s = String(Number(v.toPrecision(8)));
  } else {
    s = String(v);
  }
  if(/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadText(text, filename, mime){
  const blob = new Blob(["\ufeff" + text], { type: mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportCSV(){
  if(!currentData) return;
  const data = currentData;
  const species = [...new Set(data.cases.reduce((acc, c) => acc.concat(Object.keys(c.massfrac)), []))].sort();
  const header = [
    "Pin(psia)", "O/F",
    "Tc(" + unitLabel("T") + ")", "Tt(" + unitLabel("T") + ")",
    "Pc(" + unitLabel("P") + ")", "Pt(" + unitLabel("P") + ")",
    "MWc(g/mol)", "MWt(g/mol)", "Gamma_c", "Gamma_t",
    "CSTAR(" + unitLabel("CSTAR") + ")", "CF",
    "Ivac(" + unitLabel("Ivac") + ")", "Isp(" + unitLabel("Isp") + ")"
  ].concat(species.map(s => "mf_" + s));

  const rows = [header];
  const sorted = [...data.cases].sort((a,b) => (a.pin - b.pin) || (a.of - b.of));
  for(const c of sorted){
    const row = [
      c.pin, c.of,
      convValue("T", c.chamber.T), convValue("T", c.throat.T),
      convValue("P", c.chamber.P), convValue("P", c.throat.P),
      c.chamber.MW, c.throat.MW,
      c.chamber.GAMMA, c.throat.GAMMA,
      convValue("CSTAR", c.perf.CSTAR), c.perf.CF,
      convValue("Ivac", c.perf.Ivac), convValue("Isp", c.perf.Isp)
    ];
    species.forEach(s => row.push(c.massfrac[s] ? c.massfrac[s][0] : ""));
    rows.push(row);
  }
  const csv = rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  downloadText(csv, "CEA_data.csv", "text/csv");
  document.getElementById("status").textContent = "Exported CEA_data.csv (" + (rows.length - 1) + " rows).";
}

function renderSummary(data){
  const { pins } = getSorted(data);
  const uT = unitLabel("T"), uI = unitLabel("Isp"), uC = unitLabel("CSTAR");
  let html = "<table class='summary'><thead><tr>"
    + "<th>Pressure (psia)</th><th>Best O/F</th>"
    + "<th>Isp (" + uI + ")</th><th>C* (" + uC + ")</th><th>Tc (" + uT + ")</th>"
    + "</tr></thead><tbody>";
  for(const pin of pins){
    let best = null;
    for(const c of data.cases){
      if(c.pin === pin && c.perf.Isp !== undefined && (!best || c.perf.Isp > best.perf.Isp)) best = c;
    }
    if(!best) continue;
    html += "<tr>"
      + "<td>" + pin + "</td>"
      + "<td>" + best.of.toFixed(2) + "</td>"
      + "<td>" + convValue("Isp", best.perf.Isp).toFixed(1) + "</td>"
      + "<td>" + (best.perf.CSTAR != null ? convValue("CSTAR", best.perf.CSTAR).toFixed(1) : "-") + "</td>"
      + "<td>" + (best.chamber.T != null ? convValue("T", best.chamber.T).toFixed(1) : "-") + "</td>"
      + "</tr>";
  }
  html += "</tbody></table>";
  document.getElementById("summaryTable").innerHTML = html;
}

/* ---------------- render ---------------- */
let currentData = null;
let fontBase = 14;
let unitSystem = "si";

function renderAll(){
  if(!currentData) return;
  fontBase = parseInt(document.getElementById("fontSize").value, 10);
  unitSystem = document.getElementById("unitSystem").value;
  const data = currentData;
  const station = document.getElementById("station").value;
  const mfPin = parseFloat(document.getElementById("mfPressure").value);
  const heatMetric = document.getElementById("heatMetric").value;

  const heatTitles = {
    Isp: "Specific Impulse (" + unitLabel("Isp") + ")",
    T: "Temperature (" + unitLabel("T") + ")",
    CSTAR: "Characteristic Velocity C* (" + unitLabel("CSTAR") + ")",
    MW: "Molecular Weight (g/mol)",
    GAMMA: "Specific Heat Ratio"
  };

  plotLines("chIsp", data, "Isp", station, "Specific Impulse vs O/F", true);
  plotLines("chT", data, "T", station,
    (station === "chamber" ? "Chamber" : "Throat") + " temperature vs O/F", true);
  plotLines("chCstar", data, "CSTAR", station,
    "Characteristic velocity C* vs O/F", true);
  plotLines("chMW", data, "MW", station,
    (station === "chamber" ? "Chamber" : "Throat") + " molecular weight vs O/F", false);
  plotMassFractions("chMF", data, mfPin, station);
  plotHeatmap("chHeat", data, heatMetric, station,
    (station === "chamber" ? "Chamber " : "Throat ") + heatTitles[heatMetric]);
  renderSummary(data);
}

function populateControls(data){
  const { pins } = getSorted(data);
  const sel = document.getElementById("mfPressure");
  sel.innerHTML = "";
  pins.forEach(p => {
    const o = document.createElement("option");
    o.value = p;
    o.textContent = p + " psia";
    sel.appendChild(o);
  });
}

function renderMeta(data, name){
  const m = data.meta;
  const parts = [];
  if(m.problemType) parts.push(m.problemType);
  if(m.assumption) parts.push(m.assumption);
  if(m.compType) parts.push(m.compType === "mole" ? "mole fractions" : "mass fractions");
  if(m.fuels.length) parts.push("Fuel: " + [...new Set(m.fuels)].join(", "));
  if(m.oxidizers.length) parts.push("Oxidizer: " + [...new Set(m.oxidizers)].join(", "));
  parts.push(data.cases.length + " cases (" + getSorted(data).pins.length + " pressures x " + getSorted(data).ofs.length + " O/F)");
  document.getElementById("meta").textContent = name + "  —  " + parts.join("  ·  ");
}

function parseAndRender(text, name){
  const status = document.getElementById("status");
  try{
    const data = parseCEA(text);
    if(!data.cases.length){
      status.textContent = "No CEA output data found in this file.";
      status.className = "error";
      return;
    }
    currentData = data;
    populateControls(data);
    renderMeta(data, name);
    renderAll();
    status.textContent = "Loaded " + data.cases.length + " cases.";
    status.className = "";
    document.getElementById("dropzone").style.display = "none";
  }catch(err){
    status.textContent = "Error parsing file: " + err.message;
    status.className = "error";
    console.error(err);
  }
}

/* ---------------- file loading ---------------- */
async function loadDefault(){
  try{
    const r = await fetch("output.txt", { cache: "no-store" });
    if(r.ok){
      const t = await r.text();
      parseAndRender(t, "output.txt");
    }
  }catch(e){ /* no default file */ }
}

function bindEvents(){
  const readFile = f => {
    if(!f) return;
    const rd = new FileReader();
    rd.onload = () => parseAndRender(rd.result, f.name);
    rd.readAsText(f);
  };

  document.getElementById("fileInput").addEventListener("change", e => {
    readFile(e.target.files[0]);
  });

  document.getElementById("reloadBtn").addEventListener("click", loadDefault);

  document.getElementById("saveAllBtn").addEventListener("click", saveAll);
  document.getElementById("exportBtn").addEventListener("click", exportCSV);
  document.querySelectorAll(".saveBtn").forEach(btn => {
    btn.addEventListener("click", () => saveChart(btn.dataset.chart));
  });

  ["station", "mfPressure", "heatMetric", "fontSize", "unitSystem"].forEach(id => {
    document.getElementById(id).addEventListener("change", renderAll);
  });

  const dz = document.getElementById("dropzone");
  ["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); dz.classList.add("drag");
  }));
  ["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); dz.classList.remove("drag");
  }));

  // allow dropping anywhere on the page
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => { e.preventDefault(); readFile(e.dataTransfer.files[0]); });
}

window.addEventListener("DOMContentLoaded", () => {
  bindEvents();
  loadDefault();
  window.addEventListener("resize", () => { if(currentData) renderAll(); });
});
</script>
</body>
</html>
